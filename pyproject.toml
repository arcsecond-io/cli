[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcsecond"
version = "3.17.2"
authors = [
    { name = "Cedric Foellmi", email = "cedric@arcsecond.io" },
]
description = "CLI for arcsecond.io"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    "Operating System :: OS Independent",
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Software Development :: Libraries :: Python Modules'
]
dependencies = [
    'click>=8',
    'configparser',
    'docker',
    'httpx',
    "tqdm (>=4.67.1,<5.0.0)",
    'py-machineid',
    'wait-for-it',
    'alpyca==3.1.2',
]

[project.optional-dependencies]
# Live-image proxy: native host process that lets Docker containers reach USB
# webcams and all-sky camera images on the host. Install with:
#     pip install arcsecond[webcam]
# (extra name kept as `webcam` for backward compatibility; covers all-sky too.)
webcam = [
    'aiohttp>=3.9',
    'opencv-python-headless>=4.10,<5',
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "flake8",
    "black",
    "isort",
]

[project.scripts]
arcsecond = "arcsecond.cli:main"

[project.urls]
Homepage = "https://github.com/arcsecond-io/cli"
Issues = "https://github.com/arcsecond-io/cli/issues"
Documentation = "https://docs.arcsecond.io"

[tool.setuptools.package-data]
"arcsecond.hosting.docker" = ["docker-compose.yml"]
