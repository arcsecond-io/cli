# The network manifest of Arcsecond.local.
#
# Every connection an installation makes or accepts, one entry each. This file
# is the single source: the network sheet handed to an administrator is
# generated from it, `arcsecond doctor` tests what it lists, and a guard in
# continuous integration fails when the running stack contacts a destination
# that is not here. Nothing about the network is to be written anywhere else
# by hand.
#
# Established by the audit of 2026-10-05 (packet capture of a fresh stack, and
# a reading of the code). `evidence` says which: "captured" was seen on the
# wire, "code" was read in the source and not exercised.
#
# The text fields are read by administrators: plain sentences, no acronyms.
#
# Fields of a [[destination]]:
#   id            stable identifier
#   short         what it is for, in a few words: the line of the one-page sheet
#   from          who opens the connection: "stack" (the containers),
#                 "browser" (the user's workstation), "tool" (the arcsecond
#                 command on the host), "docker" (image downloads)
#   direction     "outbound" or "local-network" (never leaves the site)
#   names         host names; empty when the administrator chooses the server
#   port          destination port
#   ports_note    optional: what to print instead, when the port is the observatory's choice
#   transport     "tcp" or "udp"
#   encrypted     true when protected by transport layer security
#   need          "required", "recommended" or "optional"
#   enabled_by    what turns it on; "always" for a default installation
#   purpose       one plain sentence
#   feature       what a person does that triggers it
#   frequency     when, and how often
#   data_sent     categories that leave
#   without_it    what stops working
#   proxy         "yes", "no" or "untested"
#   test          how doctor checks it: "handshake", "connect" or "none"
#   evidence      "captured" or "code"

version = 1
audited = "2026-10-05"

# Where an administrator writes with a security question.
contact = "team@arcsecond.io"

# What never leaves the site, whatever is configured below.
never_sent = [
    "images and data files",
    "night logs, sessions and observing conditions",
    "equipment configuration and instrument state",
    "accounts, passwords and access keys of the installation's users",
    "usage statistics, error reports or any other telemetry",
]

# ---------------------------------------------------------------------------
# Listening ports on the machine running Arcsecond.local
# ---------------------------------------------------------------------------

[[listening]]
id = "web"
port = 5555
bound_to = "every interface"
encrypted = false
purpose = "The application itself: pages, programming interface under /api/, live streams, file downloads, bundled documentation."
reached_by = "browsers and scripts on the local network"

[[listening]]
id = "api-local"
port = 8800
bound_to = "this machine only"
encrypted = false
purpose = "The programming interface, for the arcsecond command and scripts run on the machine itself."
reached_by = "this machine"

[[listening]]
id = "live-image-proxy"
port = 8765
bound_to = "every interface"
encrypted = false
optional = true
purpose = "Relays webcam and all-sky camera images to the installation. Runs only when cameras are registered."
reached_by = "the installation, and browsers on the local network"

# ---------------------------------------------------------------------------
# Outbound, from the installation — always on
# ---------------------------------------------------------------------------

[[destination]]
id = "licensing"
short = "Licence activation and daily check"
from = "stack"
direction = "outbound"
names = ["licensing.arcsecond.io"]
port = 443
transport = "tcp"
encrypted = true
need = "required"
enabled_by = "always"
purpose = "Activates the installation and checks its licence."
feature = "Verifying the owner's email address; then automatic."
frequency = "At every start, once a day, and when the owner activates."
data_sent = ["the owner's email address", "a hashed identifier of the machine", "the licence key", "the verification code typed by the owner"]
without_it = "A new installation cannot be activated. An activated one keeps running."
proxy = "yes"
test = "handshake"
evidence = "captured"

