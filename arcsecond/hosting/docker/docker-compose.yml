# === Arcsecond.local config. ===
# *** DO NOT change any name or port number. ***
# Version 7.3

services:
  # Database (PostgresQL)
  db:
    image: postgres:16
    container_name: arcsecond-db
    restart: unless-stopped
    # No host port. The backend reaches the DB over the internal Docker
    # network (hostname `arcsecond-db`), and every CLI command that needs
    # the DB (backups, restore, password rotation) goes through `docker exec`
    # into this container. Publishing 5432 on the host bought nothing and
    # failed the whole stack whenever another Postgres already held it.
    volumes:
      - arcsecond_postgres_data:/var/lib/postgresql/data
    env_file:
      # You must have a .env file with database credentials beside this yml file.
      - .env

  # Broker (Redis) - Shared messaging service between different services.
  broker:
    image: redis:7.4
    container_name: arcsecond-broker
    restart: unless-stopped
    # No host port either: Redis with no auth must never be reachable from
    # outside the stack, and the backend reaches it over the Docker network.

  # Arcsecond backend (REST APIs). Can be used for API calls and external pipelines, scripts etc.
  backend:
    image: ghcr.io/arcsecond-io/arcsecond-api:latest
    container_name: arcsecond-api
    restart: unless-stopped
    entrypoint: /home/app/entrypoint-server.sh
    ports:
      - "8800:8800"
    depends_on:
      - db
      - broker
    # Allows the backend to reach the host machine via host.docker.internal.
    # Required on Linux; Docker Desktop on Windows/macOS adds this automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # You must have a .env file with secret keys beside this yml file.
      - .env
    volumes:
      # Leave /data as is, it's a path inside the container, not in the host machine.
      # SHARED_DATA_PATH must be a path of your host machine, specified in the .env file.
      - type: bind
        source: ${SHARED_DATA_PATH}
        target: /data
        bind:
          create_host_path: true
    stop_grace_period: 60s
    # A ceiling, so no burst of work here can take the memory Postgres needs.
    # Downloads no longer pass through these processes (the web container
    # sends them), but rendering a large frame for review still does.
    mem_limit: ${ARCSECOND_BACKEND_MEMORY:-6g}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8800/healthcheck/" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # Arcsecond worker, for offloading background work: the Control Room's
  # exposures and procedures, and everything else someone is waiting on.
  worker:
    image: ghcr.io/arcsecond-io/arcsecond-api:latest
    container_name: arcsecond-worker
    restart: unless-stopped
    entrypoint: /home/app/entrypoint-worker.sh
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # The default queue only: the data worker below takes the rest.
      ARCSECOND_WORKER_QUEUES: celery
    volumes:
      # Leave /data as is, it's a path inside the container, not in the host machine.
      # SHARED_DATA_PATH must be a path of your host machine, specified in the .env file.
      - type: bind
        source: ${SHARED_DATA_PATH}
        target: /data
        bind:
          create_host_path: true
    stop_grace_period: 120s
    mem_limit: ${ARCSECOND_WORKER_MEMORY:-6g}

  # Arcsecond data worker, for the background work nobody at the telescope is
  # waiting on: zip archives, previews of uploaded files, pushes to your
  # storages, database backups, keograms, catalogue refreshes. On its own
  # queue, so a long zip can never hold up a frame the observer is waiting for.
  dataworker:
    image: ghcr.io/arcsecond-io/arcsecond-api:latest
    container_name: arcsecond-dataworker
    restart: unless-stopped
    entrypoint: /home/app/entrypoint-worker.sh
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ARCSECOND_WORKER_QUEUES: data
      # Few at a time: this work is heavy and none of it is urgent.
      ARCSECOND_WORKER_CONCURRENCY: ${ARCSECOND_DATA_WORKER_CONCURRENCY:-2}
    volumes:
      # Leave /data as is, it's a path inside the container, not in the host machine.
      # SHARED_DATA_PATH must be a path of your host machine, specified in the .env file.
      - type: bind
        source: ${SHARED_DATA_PATH}
        target: /data
        bind:
          create_host_path: true
    stop_grace_period: 120s
    mem_limit: ${ARCSECOND_DATA_WORKER_MEMORY:-3g}

  # Arcsecond beat, to launch specific background tasks at specific times.
  beat:
    image: ghcr.io/arcsecond-io/arcsecond-api:latest
    container_name: arcsecond-beat
    restart: unless-stopped
    entrypoint: /home/app/entrypoint-beat.sh
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./.env
    stop_grace_period: 30s

  # Arcsecond plate solver service, for solving coordinates from raw images.
  platesolver:
    image: ghcr.io/arcsecond-io/arcsecond-service-platesolver-astrometry:latest
    container_name: arcsecond-platesolver
    restart: unless-stopped
    ports: [ "8900:8900" ]

  # Arcsecond webapp. Served on 5555 only: a self-hosted install is
  # organisation-based and therefore always a portal, so the second port that
  # used to be here (5577) served the very same app.
  web:
    image: ghcr.io/arcsecond-io/arcsecond-web:latest
    container_name: arcsecond-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5555:5555"
    environment:
      # Download limits: how many downloads one computer may have open at
      # once, how many in total, and the speed of each (bytes per second,
      # k and m allowed, 0 for none). They keep downloads from filling the
      # link a remote observer drives the telescope through.
      ARCSECOND_DOWNLOADS_PER_CLIENT: ${ARCSECOND_DOWNLOADS_PER_CLIENT:-6}
      ARCSECOND_DOWNLOADS_TOTAL: ${ARCSECOND_DOWNLOADS_TOTAL:-24}
      ARCSECOND_DOWNLOAD_RATE: ${ARCSECOND_DOWNLOAD_RATE:-20m}
    volumes:
      # The same folder, read-only: this container sends the stored files
      # itself, once the backend has said who may read them.
      - type: bind
        source: ${SHARED_DATA_PATH}
        target: /data
        read_only: true
        bind:
          create_host_path: true

  # >>> arcsecond:alerts
  # Arcsecond transient-alerts consumer (optional).
  # Long-lived Kafka client for NASA GCN. Outbound TLS to kafka.gcn.nasa.gov
  # and auth.gcn.nasa.gov only — nothing listens. Requires GCN_CONSUMER_CLIENT_ID /
  # GCN_CONSUMER_CLIENT_SECRET in .env; idles harmlessly when they are absent.
  # Single instance only — do not scale it.
  alerts:
    image: ghcr.io/arcsecond-io/arcsecond-api:latest
    container_name: arcsecond-alerts
    restart: unless-stopped
    entrypoint: /home/app/entrypoint-alerts.sh
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    stop_grace_period: 30s
  # <<< arcsecond:alerts

volumes:
  arcsecond_postgres_data:

